name: Build gbOS Kernel

on:
  push:
    branches: [ "Dell-Latitude-7320", "main" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build gbos-kbuild Docker image
        run: docker build -t gbos-kbuild kernel/docker/

      - name: Fetch kernel sources & toolchain
        run: sh -x kernel/fetch_kernel_sources.sh

      - name: Fetch busybox
        run: sh -x tools/fetch_busybox.sh

      - name: Build Kernel & Modules
        run: sh -x kernel/build_kernel.sh

      - name: Package Kernel Artifacts
        run: |
          mkdir -p build_output
          cp usb/out/BOOTX64.EFI build_output/
          tar -czf build_output/modules.tar.gz -C usb modules

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbos-kernel-build
          path: build_output/
